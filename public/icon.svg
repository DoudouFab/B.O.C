<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="B.O.C — Boîte à Outils du Contrôleur">
  <defs>
    <linearGradient id="boc-sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052BB8" />
      <stop offset="52%" stop-color="#1D6BFF" />
      <stop offset="100%" stop-color="#06DFDF" />
    </linearGradient>
    <linearGradient id="boc-metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="boc-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
    <linearGradient id="boc-plate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#boc-sky)" />
  <circle cx="395" cy="110" r="145" fill="#38BDF8" opacity="0.24" />
  <!-- Handle -->
  <path d="M190 156 L204 114 L308 114 L322 156" fill="none" stroke="url(#boc-metal)" stroke-width="24" stroke-linejoin="round" stroke-linecap="round" />
  <rect x="220" y="99" width="72" height="30" rx="12" fill="url(#boc-amber)" />
  <!-- Toolbox Shell -->
  <rect x="92" y="156" width="328" height="248" rx="38" fill="url(#boc-metal)" />
  <rect x="92" y="218" width="328" height="12" fill="url(#boc-amber)" />
  <!-- Latches -->
  <rect x="148" y="198" width="36" height="44" rx="10" fill="url(#boc-amber)" stroke="#FFFFFF" stroke-width="5" />
  <rect x="328" y="198" width="36" height="44" rx="10" fill="url(#boc-amber)" stroke="#FFFFFF" stroke-width="5" />
  <!-- Front Steel Badge -->
  <rect x="132" y="264" width="248" height="102" rx="22" fill="url(#boc-plate)" stroke="url(#boc-amber)" stroke-width="7" />
  <text
    x="256"
    y="334"
    text-anchor="middle"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-size="66"
    font-weight="900"
    letter-spacing="4"
    fill="#FFFFFF"
  >B.O.C</text>
</svg>
